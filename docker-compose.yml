services:
  app:
    build: .
    ports:
      - "9090:9090"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=mypassword
      - DB_NAME=subteacher
      - SERVER_PORT=9090
      - ACCESS_TOKEN_DURATION=24h
      - REFRESH_TOKEN_DURATION=720h
      - JWT_SECRET=your_jwt_secret
      - R2_ACCOUNT_ID=fdf10307cdb1e385dc0dd914aabe547f
      - R2_ACCESS_KEY_ID=fdf10307cdb1e385dc0dd914aabe547f
      - R2_ACCESS_KEY_SECRET=e727fb07d31f850a7aed1dec5ca6bc2d57b75eacf8ba509b9ebb40e23a17f788
      - R2_BUCKET_NAME=acadeer
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=mypassword
      - MYSQL_DATABASE=subteacher
    volumes:
      - mysql_data:/var/lib/mysql
      - ./subteacher_backup.sql:/docker-entrypoint-initdb.d/subteacher_backup.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmypassword"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: 